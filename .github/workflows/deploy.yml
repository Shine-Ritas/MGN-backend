name: Deploy to Server

on:
  workflow_run:
    workflows: ["Development Workflow"]
    types:
      - completed
    branches:
      - development

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    # Only run if the Development Workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Git user identity for SSH
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
            ssh-private-key: ${{ secrets.SPK }}

      - name: Deploy over SSH
        run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.SU }}@${{ secrets.SH }} << 'EOF'
                cd ${{ secrets.APP_PATH }}
                git pull
                docker compose up -d --build
                echo "🚀 Deployment complete"
              EOF