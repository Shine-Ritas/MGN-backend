# Custom PostgreSQL Configuration (Low Resource Optimized)

# Set timezone
timezone = 'Asia/Yangon'
log_timezone = 'Asia/Yangon'

# Connection Settings
listen_addresses = '*'        # Allow connections from any host
# port = 5432

# Memory Settings (Reduce memory usage)
shared_buffers = 256MB         # Lowered (good start is 25% of total RAM if possible)
work_mem = 4MB                 # Lowered (each sort/join uses this)
maintenance_work_mem = 64MB    # Lowered (used by VACUUM, CREATE INDEX, etc.)

# WAL (Write-Ahead Logging) Settings (reduce I/O)
wal_level = replica
checkpoint_timeout = 15min     # Less frequent checkpoints
max_wal_size = 512MB           # Reduce WAL size
min_wal_size = 128MB

# Query Performance Optimization
random_page_cost = 1.5         # Default is 4, 1.5 is reasonable if you have SSD
effective_cache_size = 768MB   # Estimate how much OS cache PostgreSQL can use
default_statistics_target = 50 # Lower for faster ANALYZE, but less detailed stats

# Logging (reduce disk usage)
logging_collector = on
log_statement = 'none'         # Only log errors, not every statement
log_duration = off             # Turn off duration logging unless debugging
log_directory = 'pg_log'
log_filename = 'postgresql.log'
