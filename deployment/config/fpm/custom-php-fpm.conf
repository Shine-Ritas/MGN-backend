[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
user = ${APP_USER}
group = ${APP_USER}

listen = 0.0.0.0:9001

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

catch_workers_output = yes

; Set umask to ensure files are created with proper permissions
; 002 creates files with 664 permissions and directories with 775
process.umask = 002


