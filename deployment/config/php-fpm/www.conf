[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Clear environment
clear_env = no

; Set umask for created files/directories
;php_admin_value[umask] = 0002

; Ensure directories are created with proper permissions
php_admin_value[sys_temp_dir] = /tmp
