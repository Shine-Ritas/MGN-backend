name: Build Ci/CD with Docker

on:
  workflow_run:
    workflows: ["Development Workflow"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        image:
          - { target: "api", tag: "mgn-laravel" }
          - { target: "worker", tag: "mgn-supervisor" }
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to DockerHubd
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and push Docker image (API or Worker)
      - name: Build and push ${{ matrix.image.target }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.php
          push: true
          platforms: linux/amd64
          target: ${{ matrix.image.target }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.tag }}:latest
          build-args: |
            user=radian
            uid=1000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 5: Clean the old build cache
      - name: Clean Docker build cache
        run: docker builder prune -af || true
